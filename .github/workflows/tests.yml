# Unit-Tests bei jedem Push auf main und bei Pull-Requests; vom Release
# (release.yml) ebenfalls aufgerufen: ohne grüne Tests kein Release.
# Ohne Soundkarte (tests/__init__.py ersetzt sounddevice) und ohne Stimmen
# (die Sprachausgabe wird in den Tests vorgetäuscht); die Fenster laufen
# auf einem virtuellen Bildschirm (xvfb).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Die älteste unterstützte Version und die der Release-Builds.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt
      - run: xvfb-run -a python -m unittest discover -s tests -t .

  # Installation aus dem Quelltext auf Windows und macOS: Lassen sich die
  # Abhängigkeiten installieren, und finden sich PortAudio (Ton) und Tcl/Tk
  # (Fenster)? Ohne Fenster und Ton; die Oberflächen-Tests laufen unter Linux.
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -c "import sounddevice, tkinter, piper, lameenc; print(sounddevice.get_portaudio_version()[1], tkinter.Tcl().eval('info patchlevel'))"
      - run: python main.py --version
