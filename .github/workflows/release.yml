# Baut AppImage (Linux), exe (Windows) und App (macOS, Apple Silicon).
# Tag "v*" pushen -> GitHub-Release mit allen Dateien.
# Manuell gestartet (workflow_dispatch) -> nur Build-Artefakte zum Testen.
name: Release

# Standard: nur lesen; der Job "release" bekommt unten sein Schreibrecht.
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  appimage:
    # Älteres Ubuntu = ältere glibc, damit läuft das AppImage auf mehr Systemen.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libtk8.6
      - run: pip install -r requirements.txt -c packaging/constraints.txt pyinstaller
      - name: appimagetool
        run: |
          # Fester Release und fester SHA256 statt "continuous": Ein verändertes
          # Werkzeug würde sonst unbemerkt ins ausgelieferte AppImage einfließen.
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
      - run: packaging/build_appimage.sh
        env:
          APPIMAGETOOL: ./appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Update-Quelle im AppImage (für Gear Lever, AppImageUpdate …):
          # immer das neueste Release dieses Repos.
          UPDATE_INFORMATION: "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Morsetrainer-x86_64.AppImage.zsync"
      - run: test -f dist/Morsetrainer-x86_64.AppImage.zsync
      # Wie auf Fedora, Arch, openSUSE: Dort fehlt /usr/lib/ssl, wo die
      # mitgelieferte OpenSSL die Zertifikate sucht. Der Selbsttest muss sie
      # trotzdem finden, über die des Systems (net/certs.py). Mit sudo, weil
      # ab ubuntu-24.04 AppArmor `unshare -r` (User-Namespace) sperrt.
      - run: |
          set -o pipefail
          mkdir -p /tmp/empty-ssl
          sudo unshare -m sh -c 'mount --bind /tmp/empty-ssl /usr/lib/ssl && dist/morsetrainer/morsetrainer --selftest /tmp/selftest-tls.mp3' | tee /tmp/selftest-tls.log
          grep -q "^Zertifikate: .* aus /etc/ssl/" /tmp/selftest-tls.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appimage
          path: |
            dist/Morsetrainer-x86_64.AppImage
            dist/Morsetrainer-x86_64.AppImage.zsync

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -c packaging/constraints.txt pyinstaller
      - run: bash packaging/get_voice.sh
      # Lizenzen aller mitgelieferten Teile, im Programm unter Hilfe → Lizenzen.
      - run: python packaging/third_party_licenses.py
      - run: pyinstaller --noconfirm --onefile --windowed --name Morsetrainer --add-data "CHANGELOG.md:." --add-data "CHANGELOG.en.md:." --add-data "THIRD_PARTY_LICENSES.md:." --add-data "docs/Anleitung.md:docs" --add-data "docs/Anleitung.en.md:docs" --add-data "morsetrainer/assets:morsetrainer/assets" --add-data "voices:voices" --additional-hooks-dir packaging/hooks --icon packaging/morsetrainer.ico main.py
      # Stimme und MP3 in der exe prüfen (ohne Fenster, ohne Ton).
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Morsetrainer.exe -ArgumentList '--selftest','selftest.mp3' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.mp3)) { Write-Error "Selbsttest fehlgeschlagen ($($p.ExitCode))"; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: dist/Morsetrainer.exe

  macos:
    # macos-latest = Apple Silicon (arm64). Die App ist nicht signiert und
    # nicht notarisiert (kein Apple-Entwicklerkonto), PyInstaller signiert
    # nur ad hoc; beim ersten Start muss man sie freigeben (Anleitung.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # Pillow wandelt das .ico in das .icns der App um.
      - run: pip install -r requirements.txt -c packaging/constraints.txt pyinstaller pillow
      - run: bash packaging/get_voice.sh
      # Lizenzen aller mitgelieferten Teile, im Programm unter Hilfe → Lizenzen.
      - run: python packaging/third_party_licenses.py
      - run: pyinstaller --noconfirm --windowed --name Morsetrainer --osx-bundle-identifier io.github.tilde1970.morsetrainer --add-data "CHANGELOG.md:." --add-data "CHANGELOG.en.md:." --add-data "THIRD_PARTY_LICENSES.md:." --add-data "docs/Anleitung.md:docs" --add-data "docs/Anleitung.en.md:docs" --add-data "morsetrainer/assets:morsetrainer/assets" --add-data "voices:voices" --additional-hooks-dir packaging/hooks --icon packaging/morsetrainer.ico main.py
      # Der sounddevice-Hook packt die PortAudio-DLLs für Windows mit ein. Nach
      # dem Löschen die App neu (ad hoc) signieren, sonst passt das Siegel
      # nicht mehr und macOS meldet „beschädigt“.
      - run: |
          find dist/Morsetrainer.app -name 'libportaudio*.dll' -delete
          test -f dist/Morsetrainer.app/Contents/Frameworks/_sounddevice_data/portaudio-binaries/libportaudio.dylib
          codesign --force --sign - dist/Morsetrainer.app
          codesign --verify --deep --strict --verbose=2 dist/Morsetrainer.app
      # Stimme und MP3 in der App prüfen (ohne Fenster, ohne Ton).
      - run: dist/Morsetrainer.app/Contents/MacOS/Morsetrainer --selftest selftest.mp3 && test -s selftest.mp3
      # ditto erhält Symlinks und Signatur der App im ZIP.
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Morsetrainer.app dist/Morsetrainer-macOS.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: dist/Morsetrainer-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, appimage, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
      # Quelltext der GPL-/LGPL-Teile in den Builds (piper, espeak-ng,
      # lameenc, LAME), in den Versionen aus packaging/constraints.txt.
      - run: python3 packaging/gpl_sources.py sources
      # Beschreibung: der Abschnitt dieser Version aus CHANGELOG.md, darunter
      # ab „### English“ der aus CHANGELOG.en.md (das Update-Fenster zeigt je
      # nach Sprache den einen oder anderen, net/update.py), dazu die von
      # GitHub erzeugten Hinweise (Vergleichslink).
      - run: |
          section() { awk -v v="${GITHUB_REF_NAME#v}" '/^## /{if(f)exit; if($2==v)f=1; next} f' "$1"; }
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main"
          {
            section CHANGELOG.md
            printf '\nAlle Änderungen: [CHANGELOG.md](%s/CHANGELOG.md), im Programm unter „Hilfe“.\n\n### English\n\n' "$url"
            section CHANGELOG.en.md
            printf '\nAll changes: [CHANGELOG.en.md](%s/CHANGELOG.en.md), in the program under “Help”.\n' "$url"
          } > notes.md
      # Prüfsummen: zum Nachprüfen von Hand, und das Update im Programm
      # lädt nur, was hierzu passt (morsetrainer/net/update.py).
      - run: |
          cp sources/*.tar.gz .
          sha256sum Morsetrainer-x86_64.AppImage Morsetrainer-x86_64.AppImage.zsync Morsetrainer.exe Morsetrainer-macOS.zip $(cd sources && ls *.tar.gz) > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Morsetrainer $GITHUB_REF_NAME" --notes-file notes.md --generate-notes Morsetrainer-x86_64.AppImage Morsetrainer-x86_64.AppImage.zsync Morsetrainer.exe Morsetrainer-macOS.zip SHA256SUMS.txt sources/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
