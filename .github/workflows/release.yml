# Baut AppImage (Linux), exe (Windows) und App (macOS, Apple Silicon).
# Tag "v*" pushen -> GitHub-Release mit allen Dateien.
# Manuell gestartet (workflow_dispatch) -> nur Build-Artefakte zum Testen.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  appimage:
    # Älteres Ubuntu = ältere glibc, damit läuft das AppImage auf mehr Systemen.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libtk8.6
      - run: pip install -r requirements.txt pyinstaller
      - name: appimagetool
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - run: packaging/build_appimage.sh
        env:
          APPIMAGETOOL: ./appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Update-Quelle im AppImage (für Gear Lever, AppImageUpdate …):
          # immer das neueste Release dieses Repos.
          UPDATE_INFORMATION: "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Morsetrainer-x86_64.AppImage.zsync"
      - run: test -f dist/Morsetrainer-x86_64.AppImage.zsync
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            dist/Morsetrainer-x86_64.AppImage
            dist/Morsetrainer-x86_64.AppImage.zsync

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: bash packaging/get_voice.sh
      - run: pyinstaller --noconfirm --onefile --windowed --name Morsetrainer --add-data "CHANGELOG.md:." --add-data "CHANGELOG.en.md:." --add-data "docs/Anleitung.md:docs" --add-data "docs/Anleitung.en.md:docs" --add-data "morsetrainer/assets:morsetrainer/assets" --add-data "voices:voices" --additional-hooks-dir packaging/hooks --icon packaging/morsetrainer.ico main.py
      # Stimme und MP3 in der exe prüfen (ohne Fenster, ohne Ton).
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Morsetrainer.exe -ArgumentList '--selftest','selftest.mp3' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.mp3)) { Write-Error "Selbsttest fehlgeschlagen ($($p.ExitCode))"; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Morsetrainer.exe

  macos:
    # macos-latest = Apple Silicon (arm64). Die App ist nicht signiert und
    # nicht notarisiert (kein Apple-Entwicklerkonto), PyInstaller signiert
    # nur ad hoc; beim ersten Start muss man sie freigeben (Anleitung.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # get_voice.sh braucht bash 4 (declare -A) und GNU sha256sum (das von
      # macOS kennt --status nicht).
      - run: |
          brew install bash coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
      # Pillow wandelt das .ico in das .icns der App um.
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: bash packaging/get_voice.sh
      - run: pyinstaller --noconfirm --windowed --name Morsetrainer --osx-bundle-identifier io.github.tilde1970.morsetrainer --add-data "CHANGELOG.md:." --add-data "CHANGELOG.en.md:." --add-data "docs/Anleitung.md:docs" --add-data "docs/Anleitung.en.md:docs" --add-data "morsetrainer/assets:morsetrainer/assets" --add-data "voices:voices" --additional-hooks-dir packaging/hooks --icon packaging/morsetrainer.ico main.py
      # Der sounddevice-Hook packt die PortAudio-DLLs für Windows mit ein. Nach
      # dem Löschen die App neu (ad hoc) signieren, sonst passt das Siegel
      # nicht mehr und macOS meldet „beschädigt“.
      - run: |
          find dist/Morsetrainer.app -name 'libportaudio*.dll' -delete
          test -f dist/Morsetrainer.app/Contents/Frameworks/_sounddevice_data/portaudio-binaries/libportaudio.dylib
          codesign --force --sign - dist/Morsetrainer.app
          codesign --verify --deep --strict --verbose=2 dist/Morsetrainer.app
      # Stimme und MP3 in der App prüfen (ohne Fenster, ohne Ton).
      - run: dist/Morsetrainer.app/Contents/MacOS/Morsetrainer --selftest selftest.mp3 && test -s selftest.mp3
      # ditto erhält Symlinks und Signatur der App im ZIP.
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Morsetrainer.app dist/Morsetrainer-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Morsetrainer-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # Beschreibung: der Abschnitt dieser Version aus CHANGELOG.md, dazu die
      # von GitHub erzeugten Hinweise (Vergleichslink).
      - run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{if(f)exit; if($2==v)f=1; next} f' CHANGELOG.md > notes.md
          printf '\nAlle Änderungen: [CHANGELOG.md](%s/%s/blob/main/CHANGELOG.md), im Programm unter „Hilfe“.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
      # Prüfsummen: zum Nachprüfen von Hand, und das Update im Programm
      # lädt nur, was hierzu passt (morsetrainer/net/update.py).
      - run: sha256sum Morsetrainer-x86_64.AppImage Morsetrainer-x86_64.AppImage.zsync Morsetrainer.exe Morsetrainer-macOS.zip > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Morsetrainer $GITHUB_REF_NAME" --notes-file notes.md --generate-notes Morsetrainer-x86_64.AppImage Morsetrainer-x86_64.AppImage.zsync Morsetrainer.exe Morsetrainer-macOS.zip SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
