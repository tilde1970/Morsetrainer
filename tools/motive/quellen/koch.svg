<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<defs>
<linearGradient id="sockel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a8a"/><stop offset="0.25" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
<linearGradient id="sockelfront" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#151515"/><stop offset="0.5" stop-color="#3a3a3a"/><stop offset="1" stop-color="#151515"/></linearGradient>
<linearGradient id="messing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2f2"/><stop offset="0.35" stop-color="#b8b8b8"/><stop offset="0.7" stop-color="#6c6c6c"/><stop offset="1" stop-color="#2c2c2c"/></linearGradient>
<linearGradient id="messingv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3a3a"/><stop offset="0.35" stop-color="#e0e0e0"/><stop offset="0.6" stop-color="#9a9a9a"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
<radialGradient id="bakelit" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#d0d0d0"/><stop offset="0.25" stop-color="#5a5a5a"/><stop offset="0.7" stop-color="#151515"/><stop offset="1" stop-color="#000"/></radialGradient>
<linearGradient id="bakelitv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050505"/><stop offset="0.3" stop-color="#6a6a6a"/><stop offset="0.5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#000"/></linearGradient>
</defs>
<rect width="800" height="520" fill="#fff"/>
