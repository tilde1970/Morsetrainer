<path d="M612,392 l-14,-8 l28,-8 l-28,-8 l28,-8 l-28,-8 l28,-8 l-28,-8 l14,-6" fill="none" stroke-width="5"/>
<rect x="596" y="380" width="34" height="12" fill="url(#messing)"/>
